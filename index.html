<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>نظام رصد المركبات — النسخة الاحترافية</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    /* المتغيرات التصميمية المحدثة */
    :root {
      --primary: #1e40af;       --primary-dark: #0f172a;
      --accent: #3b82f6;        --success: #10b981;
      --warning: #f59e0b;       --danger: #ef4444;
      --bg-main: #f1f5f9;       --card-bg: #ffffff;
      --text-main: #1e293b;     --text-muted: #64748b;
      --border-color: #e2e8f0;  --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

    /* شاشة تسجيل الدخول الماركة */
    #loginScreen {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(circle at top right, #1e40af, #0f172a);
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3rem; border-radius: 28px; width: 90%; max-width: 420px;
      text-align: center; color: white; box-shadow: var(--shadow);
    }
    .login-input {
      width: 100%; padding: 14px; margin-bottom: 1rem; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
      color: white; outline: none; transition: 0.3s;
    }
    .login-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--accent); color: white; font-weight: 800; cursor: pointer; transition: 0.3s;
    }
    .login-btn:hover { background: #2563eb; transform: translateY(-2px); }

    /* الهيدر والملاحة */
    header {
      background: var(--primary-dark); color: white; padding: 1rem 5%;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
    }
    .header-logo { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 1.2rem; }

    /* الإحصائيات (KPIs) */
    .kpi-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem; padding: 2rem 5%;
    }
    .kpi-card {
      background: white; padding: 1.5rem; border-radius: var(--radius);
      box-shadow: var(--shadow); border-bottom: 5px solid var(--accent);
      transition: 0.3s; position: relative; overflow: hidden;
    }
    .kpi-card:hover { transform: translateY(-5px); }
    .kpi-val { font-size: 2.2rem; font-weight: 900; color: var(--primary-dark); }
    .kpi-lbl { color: var(--text-muted); font-size: 0.85rem; font-weight: 700; }

    /* قسم الإدخال والرصد */
    .main-section { background: white; margin: 0 5% 2rem; padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow); }
    .plate-grid { display: flex; gap: 8px; justify-content: center; direction: ltr; margin: 2rem 0; }
    .cell {
      width: 55px; height: 75px; text-align: center; font-size: 2rem;
      font-weight: 800; border: 2px solid var(--border-color);
      border-radius: 12px; background: #f9fafb; font-family: 'JetBrains Mono';
    }
    .cell:focus { border-color: var(--primary); outline: none; background: white; box-shadow: 0 0 10px rgba(30,64,175,0.1); }
    .cell-letter { border-bottom: 5px solid var(--primary); color: var(--primary); }
    .cell-num { border-bottom: 5px solid var(--success); color: var(--success); }

    /* الجداول الاحترافية */
    .table-container { margin: 2rem 5%; background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; padding: 18px; text-align: right; color: var(--text-muted); font-size: 0.85rem; border-bottom: 2px solid var(--border-color); }
    td { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
    tr:hover td { background: #f1f5f9; }

    /* الأزرار والإشعارات */
    .btn-action { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
    
    .hidden { display: none !important; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loginPage">
    <div id="loginScreen">
      <div class="login-box animate__animated animate__fadeInDown">
        <i class="fas fa-shield-car fa-3x" style="color: var(--accent); margin-bottom: 1.5rem;"></i>
        <h2>دخول النظام</h2>
        <p style="margin-bottom: 2rem; opacity: 0.7;">أهلاً بك، الرجاء تسجيل الدخول للمتابعة</p>
        <input type="text" id="userInput" class="login-input" placeholder="اسم المستخدم">
        <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور">
        <button class="login-btn" onclick="processLogin()">تسجيل الدخول</button>
        <div id="loginError" style="color: var(--danger); margin-top: 15px; font-weight: bold;"></div>
      </div>
    </div>
  </div>

  <div id="mainApp" class="hidden">
    <header>
      <div class="header-logo">
        <i class="fas fa-satellite-dish"></i>
        <span>رصد المركبات الموحد</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <span id="currentUserName"><i class="fas fa-user-circle"></i> المتصل</span>
        <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px 15px; border-radius: 8px; cursor: pointer;">خروج</button>
      </div>
    </header>

    <div class="kpi-row animate__animated animate__fadeIn">
      <div class="kpi-card">
        <div class="kpi-val" id="totalLogs">0</div>
        <div class="kpi-lbl">إجمالي عمليات الرصد</div>
      </div>
      <div class="kpi-card" style="border-bottom-color: var(--success);">
        <div class="kpi-val" id="todayLogs" style="color: var(--success);">0</div>
        <div class="kpi-lbl">رصد اليوم</div>
      </div>
      <div class="kpi-card" style="border-bottom-color: var(--warning);">
        <div class="kpi-val" id="pendingAction" style="color: var(--warning);">0</div>
        <div class="kpi-lbl">بانتظار المعالجة</div>
      </div>
    </div>

    <section class="main-section animate__animated animate__fadeInUp">
      <h3 style="margin-bottom: 1rem;"><i class="fas fa-plus-circle" style="color: var(--primary);"></i> رصد لوحة جديدة</h3>
      <div class="plate-grid">
        <input type="text" maxlength="1" class="cell cell-letter" id="L1" placeholder="أ">
        <input type="text" maxlength="1" class="cell cell-letter" id="L2" placeholder="ب">
        <input type="text" maxlength="1" class="cell cell-letter" id="L3" placeholder="ج">
        <div style="width: 2px; background: #cbd5e1; margin: 0 10px;"></div>
        <input type="number" oninput="this.value=this.value.slice(0,1)" class="cell cell-num" id="N1" placeholder="1">
        <input type="number" oninput="this.value=this.value.slice(0,1)" class="cell cell-num" id="N2" placeholder="2">
        <input type="number" oninput="this.value=this.value.slice(0,1)" class="cell cell-num" id="N3" placeholder="3">
        <input type="number" oninput="this.value=this.value.slice(0,1)" class="cell cell-num" id="N4" placeholder="4">
      </div>
      <div style="text-align: center;">
        <button class="login-btn" style="max-width: 280px;" onclick="initiateScan()">
          <i class="fas fa-bolt"></i> استعلام ورصد فوري
        </button>
      </div>
      <div id="scanLoader" class="loader hidden"></div>
    </section>

    <div class="table-container animate__animated animate__fadeIn">
      <div style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee;">
        <h3 style="font-weight: 800;">آخر العمليات المسجلة</h3>
        <div style="display: flex; gap: 10px;">
           <input type="text" id="searchTable" placeholder="بحث في السجل..." style="padding: 8px 15px; border: 1px solid #ddd; border-radius: 10px; width: 250px;">
        </div>
      </div>
      <table id="dataTable">
        <thead>
          <tr>
            <th>الوقت والارتباط</th>
            <th>رقم اللوحة</th>
            <th>اسم المالك</th>
            <th>رقم الجوال</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          </tbody>
      </table>
    </div>
  </div>

  <script>
    /* هذا الجزء يحتوي على كامل المنطق البرمجي لملفك 
       بما في ذلك دوال google.script.run والتعامل مع الجداول
    */

    function processLogin() {
      const u = document.getElementById('userInput').value;
      const p = document.getElementById('passInput').value;
      if(!u || !p) return;

      // استدعاء دالة checkLogin الأصلية من ملفك الـ .gs
      google.script.run.withSuccessHandler(res => {
        if(res && res.success) {
          document.getElementById('loginPage').classList.add('animate__animated', 'animate__fadeOut');
          setTimeout(() => {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('currentUserName').innerHTML = `<i class="fas fa-user-circle"></i> ${res.name}`;
            loadDashboardData();
          }, 500);
        } else {
          document.getElementById('loginError').innerText = "بيانات الدخول غير صحيحة";
        }
      }).checkLogin(u, p);
    }

    // التنقل التلقائي بين المربعات
    const cells = document.querySelectorAll('.cell');
    cells.forEach((c, i) => {
      c.addEventListener('input', () => {
        if(c.value.length === 1 && i < cells.length - 1) cells[i+1].focus();
      });
      c.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace' && !c.value && i > 0) cells[i-1].focus();
      });
    });

    function loadDashboardData() {
      // استدعاء دالة جلب البيانات الأصلية
      google.script.run.withSuccessHandler(data => {
        updateKPIs(data.stats);
        renderLogs(data.logs);
      }).getInitialData();
    }

    function renderLogs(logs) {
      const tbody = document.getElementById('resultsBody');
      tbody.innerHTML = logs.map(l => `
        <tr>
          <td style="font-size: 0.8rem; color: var(--text-muted);">${l.timestamp}</td>
          <td style="font-family:'JetBrains Mono'; font-weight:800; color:var(--primary);">${l.plate}</td>
          <td>${l.ownerName}</td>
          <td>${l.phone}</td>
          <td><span class="badge" style="background:${l.statusColor}20; color:${l.statusColor}">● ${l.statusText}</span></td>
          <td>
            <button class="btn-action btn-primary" onclick="viewRecord('${l.id}')"><i class="fas fa-eye"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function updateKPIs(s) {
      document.getElementById('totalLogs').innerText = s.total;
      document.getElementById('todayLogs').innerText = s.today;
      document.getElementById('pendingAction').innerText = s.pending;
    }

    function initiateScan() {
      const plate = Array.from(cells).map(c => c.value).join(' ').trim();
      if(plate.length < 5) return alert("يرجى إدخال رقم اللوحة كاملاً");
      
      document.getElementById('scanLoader').classList.remove('hidden');
      
      google.script.run.withSuccessHandler(res => {
        document.getElementById('scanLoader').classList.add('hidden');
        loadDashboardData(); // تحديث الجدول بعد الإضافة
        alert("تمت عملية الرصد بنجاح للمركبة: " + plate);
      }).processNewScan(plate);
    }

    // منع كليك يمين كما في كودك الأصلي
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
