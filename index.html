<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>نظام رصد السيارات المطور — مدمج</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --success: #10b981;
      --danger: #ef4444;
      --radius-lg: 20px;
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
    }

    /* واجهة تسجيل الدخول */
    #loginScreen {
      position: fixed; inset: 0; z-index: 10000;
      background: radial-gradient(circle at top right, #1e3a8a, #0f172a);
      display: flex; align-items: center; justify-content: center;
    }
    #loginScreen.hidden { display: none; }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 40px; width: 90%; max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center; color: white;
    }

    .login-input {
      width: 100%; padding: 12px; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
      color: white; margin-bottom: 15px; text-align: center;
      font-family: inherit;
    }

    /* لوحة التحكم */
    .header {
      background: #fff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    .main { max-width: 1200px; margin: 0 auto; padding: 20px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    
    .stat-card {
      background: white; padding: 20px; border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 5px solid var(--primary);
    }

    /* تصميم حقول اللوحة */
    .plate-container {
      background: #f1f5f9; padding: 20px; border-radius: 15px;
      display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;
    }
    .plate-input {
      width: 50px; height: 60px; text-align: center; font-size: 24px;
      font-weight: bold; border: 2px solid #cbd5e1; border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    
    .btn { padding: 10px 25px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-primary { background: var(--primary); color: white; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { text-align: right; padding: 12px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <div style="font-size: 50px; margin-bottom: 10px;">🛡️</div>
      <h2 style="margin-bottom: 5px;">دخول النظام</h2>
      <p style="opacity: 0.6; font-size: 13px; margin-bottom: 25px;">برجاء إدخال اسم المستخدم للمتابعة</p>
      <input type="text" id="userInput" class="login-input" placeholder="اسم المستخدم (بالعربي)">
      <button class="btn btn-primary" style="width: 100%; padding: 15px;" onclick="handleLogin()">دخول</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="header">
      <div style="font-weight: bold; color: var(--primary); font-size: 18px;">نظام الرصد الذكي</div>
      <div id="userBadge" style="background: #eff6ff; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 600;"></div>
    </header>

    <main class="main">
      <div class="stats-grid">
        <div class="stat-card">
          <div style="font-size: 12px; color: #64748b; margin-bottom: 5px;">إجمالي السيارات اليوم</div>
          <div id="countDisplay" style="font-size: 32px; font-weight: 800; color: var(--primary);">0</div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 20px; font-size: 16px;">➕ رصد مركبة جديدة</h3>
        
        <div class="plate-container">
          <input type="text" id="p1" maxlength="1" class="plate-input" placeholder="أ">
          <input type="text" id="p2" maxlength="1" class="plate-input" placeholder="ب">
          <input type="text" id="p3" maxlength="1" class="plate-input" placeholder="ج">
          <input type="number" id="pNum" class="plate-input" style="width: 110px;" placeholder="1234">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group">
            <label style="font-size: 12px; display: block; margin-bottom: 5px;">الموقع (البرج)</label>
            <select id="towerLoc" class="login-input" style="background: #f1f5f9; color: black; border: 1px solid #ddd;">
              <option value="A">برج A</option>
              <option value="B">برج B</option>
              <option value="C">برج C</option>
            </select>
          </div>
          <div class="form-group">
            <label style="font-size: 12px; display: block; margin-bottom: 5px;">رقم الدور</label>
            <input type="text" id="floorLoc" class="login-input" style="background: #f1f5f9; color: black; border: 1px solid #ddd;" placeholder="مثلاً: P1">
          </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 15px;" onclick="addVehicle()">حفظ السجل الآن</button>
      </div>

      <div class="card" style="overflow-x: auto;">
        <h3 style="margin-bottom: 15px; font-size: 16px;">📋 السجلات الأخيرة</h3>
        <table>
          <thead>
            <tr>
              <th>الوقت</th>
              <th>اللوحة</th>
              <th>الموقع</th>
              <th>بواسطة</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    let localData = [];
    let currentUser = "";

    function handleLogin() {
      const user = document.getElementById('userInput').value.trim();
      if(!user) return alert("يرجى إدخال اسمك");
      
      currentUser = user;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('userBadge').innerText = "👤 " + currentUser;
    }

    function addVehicle() {
      const p1 = document.getElementById('p1').value.trim();
      const p2 = document.getElementById('p2').value.trim();
      const p3 = document.getElementById('p3').value.trim();
      const num = document.getElementById('pNum').value.trim();
      const tower = document.getElementById('towerLoc').value;
      const floor = document.getElementById('floorLoc').value;

      if(!num) return alert("يرجى إدخال رقم اللوحة");

      const entry = {
        time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
        plate: `${p1} ${p2} ${p3} - ${num}`,
        loc: `برج ${tower} (${floor})`,
        guard: currentUser
      };

      localData.unshift(entry);
      renderTable();
      clearInputs();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = localData.map(item => `
        <tr>
          <td>${item.time}</td>
          <td><span style="font-family:'JetBrains Mono'; font-weight:bold; background:#eee; padding:2px 8px; border-radius:4px;">${item.plate}</span></td>
          <td>${item.loc}</td>
          <td>${item.guard}</td>
        </tr>
      `).join('');
      
      document.getElementById('countDisplay').innerText = localData.length;
    }

    function clearInputs() {
      ['p1','p2','p3','pNum','floorLoc'].forEach(id => document.getElementById(id).value = "");
    }
  </script>
</body>
</html>
